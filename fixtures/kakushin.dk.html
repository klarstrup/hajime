<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kakushin Dojo</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Full height container setup */
    .landing-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5vh;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    /* Initial logo state and intro animation */
    .logo-container {
      margin-top: 35vh; /* Starts vertically centered */
      animation: logoMoveUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 10;
    }

    .club-logo {
      width: 260px;
      height: auto;
      animation: logoShrink 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Content container animation */
    .content-fade-in {
      opacity: 0;
      animation: fadeInContent 1s ease-out 0.8s forwards;
      width: 100%;
    }

    /* Keyframes */
    @keyframes logoMoveUp {
      from {
        margin-top: 35vh;
      }
      to {
        margin-top: 2rem;
      }
    }

    @keyframes logoShrink {
      from {
        width: 260px;
      }
      to {
        width: 140px;
      }
    }

    @keyframes fadeInContent {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Stylized schedule cards */
    .schedule-card {
      border: none;
      border-top: 4px solid #dc3545; /* Kyokushin Red Accent */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease-in-out;
    }

    .schedule-card:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <main class="landing-wrapper">
    <!-- Animated Logo -->
    <div class="logo-container text-center">
      <img 
        src="/images/kakushin-logo-rund.jpg" 
        alt="Kakushin Dojo Logo" 
        class="club-logo img-fluid rounded-circle shadow-sm"
      >
    </div>

    <!-- Animated Content Block -->
    <div class="content-fade-in">
      <header class="text-center my-4 px-3">
        <h1 class="display-4 fw-bold text-dark mb-2">Kakushin Dojo</h1>
        <p class="lead text-muted mx-auto" style="max-width: 600px;">
          Vores hjemmeside er i øjeblikket under ombygning. Vi glæder os til snart at byde dig velkommen til vores nye side!
        </p>
      </header>

      <!-- Training Schedule Section -->
      <section class="container my-5" style="max-width: 900px;">
        <h2 class="h3 text-center fw-bold mb-4 text-uppercase tracking-wide">Træningstider</h2>
        
        <div class="row g-4 justify-content-center">
          <!-- Tirsdag -->
          <div class="col-md-4">
            <div class="card h-100 schedule-card bg-light">
              <div class="card-body text-center p-4">
                <h3 class="h4 card-title fw-bold text-dark mb-3">Tirsdag</h3>
                <div class="py-2 border-bottom">
                  <span class="d-block fw-semibold text-secondary">Børn</span>
                  <span class="fs-5 text-dark">kl. 17–18</span>
                </div>
                <div class="pt-2">
                  <span class="d-block fw-semibold text-secondary">Voksne</span>
                  <span class="fs-5 text-dark">kl. 18–20</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Torsdag -->
          <div class="col-md-4">
            <div class="card h-100 schedule-card bg-light">
              <div class="card-body text-center p-4">
                <h3 class="h4 card-title fw-bold text-dark mb-3">Torsdag</h3>
                <div class="py-2 border-bottom">
                  <span class="d-block fw-semibold text-secondary">Børn</span>
                  <span class="fs-5 text-dark">kl. 17–18</span>
                </div>
                <div class="pt-2">
                  <span class="d-block fw-semibold text-secondary">Voksne</span>
                  <span class="fs-5 text-dark">kl. 18–20</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Søndag -->
          <div class="col-md-4">
            <div class="card h-100 schedule-card bg-light">
              <div class="card-body text-center p-4">
                <h3 class="h4 card-title fw-bold text-dark mb-3">Søndag</h3>
                <div class="py-3">
                  <span class="d-block fw-semibold text-secondary">Kamptræning</span>
                  <span class="fs-5 text-dark">kl. 10–12</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Optional Footer Info -->
      <footer class="text-center py-4 text-muted small border-top mt-5">
        &copy; Kakushin Dojo – Kyokushin Karate
      </footer>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
